[package]
name = "dsh-desktop"
version = "0.1.0-rc.6"
description = "Tauri 2 desktop shell that boots the DeepSeek Harness web server and hosts its browser UI"
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
open = "5"
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
